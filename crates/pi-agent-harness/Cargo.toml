[package]
name = "pi-agent-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "pi-agent-harness: compaction and branch summarization, skills and prompt templates, reference tools, telemetry, and orchestration over agent-core + session + environment."
publish = false

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["alloc", "async-await", "std"] }
pi-agent-core = { path = "../pi-agent-core" }
pi-agent-env = { path = "../pi-agent-env" }
pi-agent-session = { path = "../pi-agent-session" }
pi-ai = { path = "../pi-ai" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }

[dev-dependencies]
futures-executor = "0.3.31"
