[package]
name = "agentprism-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Binding-friendly product surface: scalar construction of the AgentPrism client and agent over the canonical crates."
publish = false

[dependencies]
agentprism-ai = { path = "../agentprism-ai" }
agentprism-core = { path = "../agentprism-core" }
agentprism-runtime-tokio = { path = "../agentprism-runtime-tokio" }
agentprism-providers-all = { path = "../../providers/agentprism-providers-all" }
agentprism-bedrock = { path = "../../providers/agentprism-bedrock" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["rt-multi-thread"] }
