[package]
name = "pi-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "pi-ai: canonical messages and model descriptors, replay envelope and stream assembly, API-family lowering and wire encoders, the Models registry (auth, catalogs, retry configuration), and provider registrations."
publish = false

[dependencies]
arc-swap = "1.7.1"
base64 = "0.22.1"
fastrand = "2.3.0"
futures-core = "0.3.31"
futures-timer = "3.0.3"
futures-util = "0.3.31"
http = "1.3.1"
httpdate = "1.0.3"
indexmap = { version = "2.11.4", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
futures-executor = "0.3.31"
static_assertions = "1.1.0"
