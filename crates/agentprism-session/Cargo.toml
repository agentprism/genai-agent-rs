[package]
name = "agentprism-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "agentprism-session: immutable session entry tree, lanes and operation records, reducers and recovery, storage traits."
publish = false

[dependencies]
agentprism-core = { path = "../agentprism-core" }
agentprism-ai = { path = "../agentprism-ai" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }

[dev-dependencies]
futures-executor = "0.3.31"
static_assertions = "1.1.0"
