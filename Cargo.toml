[package]
name = "rust-genai-codex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "ChatGPT-plan Codex backend StreamFn for rust-genai-agent (chatgpt.com/backend-api). Rust equivalent of pi-ai's openai-codex-responses.ts, consuming OAuth tokens from rust-genai-auth."
readme = "README.md"
keywords = ["ai", "agents", "llm", "codex", "chatgpt"]
categories = ["asynchronous", "api-bindings"]

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
# Convenience adapter that builds a `TokenSource` from rust-genai-auth's
# `CodexTokenResolver` (fresh bearer + refresh + persist). Pulls in the auth
# crate's `genai` feature, which is where the resolver lives.
auth-resolver = ["rust-genai-auth/genai"]

[dependencies]
# The agent StreamFn trait + assistant event protocol we implement/emit.
rust-genai-agent = { path = "../rust-genai-agent" }
# OAuth token source (bearer + chatgpt-account-id). The `jwt` account-id
# extractor is always available; `CodexTokenResolver` needs `auth-resolver`.
rust-genai-auth = { path = "../rust-genai-auth" }
# genai stream/message vocabulary used to build the Responses request body and
# to translate Codex events through `AssistantAccumulator` (same path as
# GenaiStreamFn). Pinned to the same fork/version the agent crate uses.
genai = { version = "0.7.0-beta.18", path = "../rust-genai" }

async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
# HTTP client for the SSE transport (rustls TLS for real chatgpt.com; plain HTTP
# for the offline mock-server tests).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the request body field order stable (nicer for assertions
# and diffs); matches rust-genai-agent.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7" }
# WebSocket transport. rustls TLS for wss://chatgpt.com; `connect`/`handshake`
# (default) also cover the ws:// mock server used by tests (client + server).
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# Full tokio for the offline mock servers (TcpListener + io + accept side of WS).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
