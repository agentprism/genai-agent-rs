[workspace]
resolver = "2"
members = [
    "crates/pi-ai",
    "crates/pi-agent-core",
    "crates/pi-agent-session",
    "crates/pi-agent-harness",
    "crates/pi-agent-env",
    "crates/pi-agent-runtime-tokio",
    "crates/pi-agent-compat-pi-jsonl",
    "bindings/pi-ffi",
    "providers/pi-ai-openai",
    "providers/pi-ai-anthropic",
    "providers/pi-ai-google",
]

# genai-agent-rs — the Rust port of pi's agent stack, built to the architecture in
# docs/porting-pi-ai-and-agent-core-docs/architecture-v2-part1-proposal.md and
# architecture-v2-part2-revision.md, under the standard in goal.md (mirrored in AGENTS.md / CLAUDE.md).
#
# Workspace shape (part 1 §2, part 2 "Source baseline and revised architecture"):
#   crates/      pi-ai, pi-agent-core, pi-agent-session, pi-agent-harness, pi-agent-env,
#                pi-agent-runtime-tokio, pi-agent-compat-pi-jsonl
#   providers/   one leaf crate per provider (pi-ai-openai, pi-ai-anthropic, …) plus
#                pi-ai-providers-all — added in Milestone 4
#   bindings/    pi-ffi — added in Milestone 5
#   examples/
#
# The earlier crates (ai, genai, agent, ffi) live on the `legacy/pre-architecture-v2` branch.

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
