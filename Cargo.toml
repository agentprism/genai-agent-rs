[workspace]
resolver = "2"
members = ["genai", "agent", "ffi", "ai"]

# Release profile for the mobile/FFI artifact (see ffi/): small and symbolicated.
# `debuginfo` strip keeps symbol tables (production crash reports stay symbolicated;
# final stripping is the consuming app's link decision). panic=unwind is kept on
# purpose: UniFFI catches panics at the FFI boundary and surfaces them as errors.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"

# genai-agent-rs — four crates. The governing statement for the port is
# docs/porting-pi-ai-and-agent-core-docs/goal.md (mirrored in AGENTS.md / CLAUDE.md).
#
#   ai      — agentprism-ai (lib target `ai`): THE pi-ai port — idiomatic Rust with full
#             behavioral parity to @earendil-works/pi-ai at the pinned commit. The pi-agent-core
#             port will be built on this crate. publish = false until the first reviewed milestone.
#   genai   — genai-agentprism: legacy owned fork of jeremychone/rust-genai (git subtree; pull-only
#             upstream sync via `git subtree pull --prefix=genai upstream main`) carrying an
#             assistant/stream contract, GenaiStreamFn, and feature-gated `auth`/`codex` modules
#             used by the legacy agent crate. Not the pi-ai port.
#   agent   — rust-genai-agent: legacy provider-neutral agent loop built on `genai`, with a
#             deliberately partial scope. Not the pi-agent-core port.
#   ffi     — genai-agent-ffi: UniFFI (Swift) bindings for the legacy agent crate.
#
# The legacy agent crate depends on `genai` via Cargo's dual-source form (`path` for local builds,
# exact `version` pin for the packaged form). genai-agentprism and rust-genai-agent are published
# to crates.io in lockstep (`genai-agentprism` first).
