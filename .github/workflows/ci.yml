name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # Parity manifest (architecture v2 part 2 §10): fails on an unmapped upstream test file, a mapped
      # Rust test that does not exist, a divergence without a reason, or a pin change without
      # regenerating the manifest. Added by Milestone 1; until then this step is a no-op.
      - name: Parity manifest
        run: |
          if [ -f parity/check.sh ]; then bash parity/check.sh; else echo "parity/check.sh not present yet"; fi
