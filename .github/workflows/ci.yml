name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Platform-neutral Rust suites run on the cheap/fast runner.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # First-party crates only: the vendored genai/ subtree keeps upstream's style
      # (genai/rustfmt.toml, hard tabs) and is deliberately exempt — reformatting it would
      # make every upstream `git subtree pull` conflict.
      - name: cargo fmt --check (first-party crates)
        run: cargo fmt -p rust-genai-agent -p genai-agent-ffi -- --check

      # --all-features matters: agent/tests/*.rs are
      # `#![cfg(feature = "testing")]`-gated, so a default-features run compiles
      # them to nothing and reports false green (this exact gap once shipped a
      # regression). Per-package scope because genai's TLS features are mutually
      # exclusive BY DESIGN (compile_error), so --workspace --all-features can
      # never be a valid gate.
      - name: cargo test (agent + ffi, all features)
        run: cargo test -p rust-genai-agent -p genai-agent-ffi --all-features --locked

      # genai fork: lib tests + offline integration suites (yakbak replay,
      # auth/codex harnesses). The `tests_p_*` targets hit live providers and
      # fail keyless with ApiKeyEnvNotFound — excluded by name. Two gotchas kept
      # explicit: cargo test fail-fasts across test targets (a failing target
      # hides later ones), and the auth/loopback/codex harnesses are
      # feature-gated — without --features they compile to empty binaries and
      # report a silent "0 passed", so the features are enabled here (they are
      # compatible with the default rustls-tls; only native-tls conflicts).
      - name: cargo test (genai fork, offline suites)
        run: |
          targets=$(ls genai/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
            | grep -v '^tests_p_' | sed 's/^/--test /' | tr '\n' ' ')
          cargo test -p genai-agentprism --locked \
            --features "auth loopback codex codex-auth-resolver" --lib $targets

  # Apple-specific work stays on macOS (iOS SDK + Swift toolchain needed).
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Builds the XCFramework (all three Apple slices) + verifies artifacts.
      - name: Build Apple package
        run: ffi/build_apple.sh

      - name: Swift package tests
        run: swift test
        working-directory: ffi/swiftpm
