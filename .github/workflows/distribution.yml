# DIST-01 distribution gate.
#
# This workflow runs the interim-distribution release gate only. It performs NO publication
# action: no publish/login subcommand, no registry credentials, and no release upload anywhere
# in this repository's CI. The gate itself (scripts/check-distribution.sh) re-verifies that
# `publish = false` is still set and fails if any workflow ever attempts publication.
name: distribution-gate

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rust-genai-agent (pinned commit)
        uses: actions/checkout@v4
        with:
          path: rust-genai-agent

      - name: Check out the genai fork (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: agentprism/rust-genai
          ref: cee6008346595fcf14f77b53ee3bffe682d651c6
          path: rust-genai

      - name: Install Rust (MSRV-pinned toolchain)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"
          components: rustfmt

      - name: Run the DIST-01 distribution gate
        run: ./rust-genai-agent/scripts/check-distribution.sh
        env:
          AGENT_ROOT: ${{ github.workspace }}/rust-genai-agent
          GENAI_ROOT: ${{ github.workspace }}/rust-genai
