[package]
name = "rust-genai-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Provider-neutral streaming agent loops and tools for rust-genai"
readme = "README.md"
repository = "https://github.com/agentprism/rust-genai-agent"
keywords = ["ai", "agents", "llm", "generative-ai", "rust-genai"]
categories = ["asynchronous", "api-bindings"]
# DIST-01: this crate depends on fork-only `genai` APIs that are not on any registry, so it must
# not be published until a registry-only fresh consumer can resolve them. Distribution is via
# locally packaged crate archives plus an exact pinned patch — see scripts/check-distribution.sh
# (the release gate also fails if this flag is removed or flipped).
publish = false

[features]
default = []
testing = []
proxy = ["dep:eventsource-stream", "tokio/net", "tokio/io-util"]

[dependencies]
# Fork pin window. The crate compiles against fork-only genai APIs from the pinned fork commit
# (fork version 0.7.0-beta.19.1-agentprism), which no registry serves. Cargo's [patch] mechanics
# require the dependency requirement to match at least one published registry version, so the
# requirement is a tight window over the 0.7.0-beta line whose floor is the last published beta;
# the actual code always comes from the pinned fork — locally via `path` (dual-source form), for
# packaged consumers via their own [patch.crates-io] entry pointing at the extracted genai
# archive (the window's upper bound keeps any future upstream pre-release from outranking the
# fork patch). `cargo package` strips the `path` and re-resolves the window against the registry
# (floor beta.18), which is exactly why publication must stay disabled. The exact fork version
# and commit are verified by scripts/check-distribution.sh.
genai = { version = ">=0.7.0-beta.18, <0.7.0-beta.20", path = "../rust-genai" }
async-trait = "0.1"
eventsource-stream = { version = "0.2.3", optional = true }
futures = "0.3"
jsonschema = { version = "0.49", default-features = false }
# Non-optional (not just `proxy`): the exec-hook adapters in `stream_fn` name
# `reqwest::StatusCode`/`HeaderMap` because the genai fork's interceptor signatures use them.
# reqwest is already a mandatory transitive dependency of genai, so this adds no tree weight.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
# Local one-shot capture servers for the GenaiStreamFn exec-hook wiring tests.
tokio = { version = "1", features = ["net", "io-util"] }


