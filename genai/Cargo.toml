[package]
# Renamed from upstream `genai`: this is our owned fork republished under a distinct crates.io
# name (the pi-ai equivalent). Code still refers to it as `genai` via `package = "genai-agentprism"`
# in dependents. Kept in sync with upstream jeremychone/rust-genai via `git subtree pull`.
name = "genai-agentprism"
# Fork-lineage version: upstream's 0.7.0-beta.19 WIP line plus the agentprism fork's APIs
# (request-level exec-hook overrides, ToolResponse parts, streaming HTTP error headers, ...) and
# the folded pi-ai layer (assistant/stream contract, GenaiStreamFn, and the feature-gated `auth`
# and `codex` modules). The numeric `.N` + `-agentprism` pre-release suffix keeps the artifact
# distinct from — and predictably ordered against — anything upstream may publish
# (beta.19 < this < beta.20). Published to crates.io as `genai-agentprism`.
version = "0.7.0-beta.19.1-agentprism"
repository = "https://github.com/agentprism/genai-agent-rs"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["api-bindings", "asynchronous", "web-programming"]
description = "AgentPrism fork of genai (rust-genai): multi-AI-provider client plus the pi-ai layer — assistant/stream contract, GenaiStreamFn, and optional OAuth (auth) and ChatGPT-plan Codex backend."
keywords = ["generative-ai","openai","anthropic","gemini","agent"]
homepage = "https://github.com/agentprism/genai-agent-rs"

# The crate is published as `genai-agentprism`, but all first-party code (this crate's own tests
# and examples, and the dependent `rust-genai-*` crates) refers to it as `genai`. Dependents get
# that name via `package = "genai-agentprism"` on their dependency; this crate's own tests/examples
# get it by keeping the lib target named `genai`.
[lib]
name = "genai"

[lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.
# missing_docs = "warn"

[features]
default = ["rustls-tls"]

# -- TLS backend (forwarded to reqwest). Pick ONE; `rustls-tls` is the default.
# rustls + aws-lc-rs provider + OS trust store (rustls-platform-verifier).
# Recommended: no system OpenSSL, works on musl/static, honors enterprise CAs.
rustls-tls = ["reqwest/rustls"]
# System TLS: OpenSSL (Linux) / SChannel (Windows) / Secure Transport (macOS).
# NOTE: rustls-tls and native-tls are mutually exclusive. When selecting native-tls,
# set `default-features = false` — otherwise both backends compile and the build fails
# with a `compile_error!` (see src/lib.rs) telling you to do so.
native-tls = ["reqwest/native-tls"]
#
# BYO crypto provider (FIPS/ring), static OpenSSL, custom root CAs, or mTLS: not a genai
# feature — build your own `reqwest::Client` and inject it via `Client::builder().with_reqwest(...)`.

# -- AWS
# AWS Bedrock Converse adapter using SigV4 signing + the full AWS credential chain.
# Pulls in aws-config (env → profile → SSO → IMDS → AssumeRole) and aws-sigv4 (request signing).
# Heavy: aws-config transitively adds aws-smithy-*, hyper, tower, h2.
#
# The simpler Bearer-token Bedrock adapter (BEDROCK_API_KEY) is always available — no feature
# needed — since it has no extra dependencies.
bedrock-sigv4 = [
	"dep:aws-config",
	"dep:aws-credential-types",
	"dep:aws-sigv4",
]

# -- Telemetry
# OpenTelemetry GenAI instrumentation (OFF by default).
# Emits `gen_ai.*` tracing spans following the OpenTelemetry GenAI semantic
# conventions (see docs/otel.md). This is a pure tracing-bridge: it only uses
# the `tracing` crate (already a dependency) and adds no extra dependencies.
# Bring your own OpenTelemetry pipeline in the application (e.g. wire
# `tracing-opentelemetry` onto a `tracing-subscriber` registry) to export the
# spans; genai records to whatever `tracing` subscriber is installed.
otel = []

# -- Relocated agent modules
# Gates the testing-only helper `stream_fn::stream_error_model` (was behind the agent crate's
# `testing` feature before the module moved here). The agent crate's `testing` feature forwards to
# this one so the helper is compiled exactly when a testing build asks for it.
testing = []

# -- Folded first-party crates (off by default) ------------------------------
# `auth` (was the `rust-genai-auth` crate): OAuth login / token cache / refresh, the structural
# equivalent of pi-ai's `auth/`. Base OAuth (credential, device_code, jwt, pkce, store, codex,
# error) PLUS the genai `AuthResolver` adapter (`auth::genai_integration`) — in the standalone
# crate the adapter was behind a `genai` feature that pulled a `genai` path dep; now that this code
# lives inside genai-agentprism, `genai` is always available, so the resolver is unconditionally
# part of `auth`. Pulls the crypto/randomness/file-lock deps the OAuth flow needs.
auth = ["dep:sha2", "dep:getrandom", "dep:fs2", "tokio/sync"]
# Optional local loopback redirect-capture server for the browser login flow (auth::loopback).
loopback = ["auth"]

# `codex` (was the `rust-genai-codex` crate): the ChatGPT-plan Codex backend StreamFn (pi-ai's
# `api/openai-codex-responses.ts`) + its protocol/events/request/stream/token/error modules.
codex = ["dep:async-stream", "dep:tokio-tungstenite"]
# Convenience adapter (`codex::ResolverTokenSource`) building a codex `TokenSource` from auth's
# `CodexTokenResolver` (fresh bearer + refresh + persist + account id from the JWT).
codex-auth-resolver = ["codex", "auth"]

[dependencies]
# -- Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "test-util", "io-util", "sync", "time"]}
futures = "0.3"
tokio-stream = "0.1"
# Used by the relocated assistant/stream-function modules (moved from rust-genai-agent).
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
# -- Json
serde = { version = "1", features = ["derive", "rc"] } # Opted to rc for Arc<T> serialization
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = "3"
# -- Web
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "gzip", "charset", "http2", "system-proxy", "form"] }
eventsource-stream = "0.2"
bytes = "1.6"
# -- File
base64 = "0.23.0"
mime_guess = "2"
# -- Macro uttils
paste = "1.0"
macro_rules_attribute = "0.2.2"
# -- Tracing
tracing = { version = "0.1", features = ["default"] }
# -- Others
derive_more = { version = "2", features = ["from", "display"] }
value-ext = "0.1.3"
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.21.0", features = ["v4"] }
regex = "1"

# -- AWS Bedrock (optional, `bedrock-sigv4` feature)
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sigv4 = { version = "1", optional = true }

# -- Folded auth crate deps (optional, `auth` feature). PKCE S256 challenge = base64url(sha256).
sha2 = { version = "0.10", optional = true }
# Cryptographically-secure randomness for the PKCE verifier and CSRF state.
getrandom = { version = "0.2", optional = true }
# Cross-process advisory file lock around the resolver's read-modify-write token refresh.
fs2 = { version = "0.4", optional = true }

# -- Folded codex crate deps (optional, `codex` feature). SSE stream body construction.
async-stream = { version = "0.3", optional = true }
# WebSocket transport for the Codex backend (wss://chatgpt.com; ws:// for the offline mock tests).
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }

# Secure temp-file open flags (O_NOFOLLOW) for the `auth` credential store, used only through safe
# std OpenOptionsExt. Compiled only on unix and only reached by `auth`-gated code; libc is already
# present transitively (tokio/reqwest), so this adds no new build cost.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OTel example references `genai::otel`, so it only builds with the feature on.
[[example]]
name = "c12-otel"
required-features = ["otel"]

[dev-dependencies]
schemars = "1.2.1"
simple-fs = "0.12"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
serial_test = "4"
base64 = "0.23.0"
bitflags = "2.8"
gcp_auth = "0.12"
# -- Yakbak (HTTP record/replay for integration tests)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
# -- Folded auth/codex test deps. `tempfile` backs the credential-store tests; the extra tokio
# `net` feature (merged into the normal tokio dep for test builds) powers the local TcpListener
# mock servers the auth/codex integration tests spin up.
tempfile = "3"
tokio = { version = "1", features = ["net"] }

# docs.rs: build the folded first-party modules (auth/codex) so they appear in the published
# docs. NOT `all-features`: `rustls-tls` (default) and `native-tls` are mutually exclusive by
# design (`compile_error!` in src/lib.rs), so the all-features combination can never build.
[package.metadata.docs.rs]
features = ["auth", "loopback", "codex", "codex-auth-resolver", "bedrock-sigv4", "otel"]
