[package]
name = "genai-agent-ffi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "UniFFI (Swift) bindings for rust-genai-agent — Layer B1 of docs/embedding.md"

[features]
default = []
# Offline end-to-end tests drive a scripted provider stream (no network).
testing = ["rust-genai-agent/testing"]

[dependencies]
rust-genai-agent = { path = "../agent" }
genai = { package = "genai-agentprism", path = "../genai" }
# Pinned to a main commit because no release yet contains the Swift 6 strict-
# concurrency fix for async callback interfaces (mozilla/uniffi-rs#2929 — the
# @Sendable annotations landed post-0.32.0). Return to crates.io once a release
# (0.32.1 / 0.33) ships it.
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "bc6a335eb9588bccb8f57b89bae8c7dcfa5878e8", features = ["cli"] }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lib]
name = "genai_agent_ffi"
# lib: tests · staticlib: .a for Apple targets · cdylib: .dylib for uniffi-bindgen
crate-type = ["lib", "staticlib", "cdylib"]
