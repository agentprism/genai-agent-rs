[[mapping]]
source = "packages/ai/src/api/anthropic-messages.ts"
rust = ["anthropic_signature_survives_message_round_trip", "persisted_anthropic_replay_item_json_matches_architecture", "persisted_anthropic_thinking_json_matches_architecture"]
status = "deliberate-divergence"
reason = "The §10.11 replay-envelope replacement makes Pi's silently mutated thinkingSignature explicit and persistable."

[[mapping]]
source = "packages/ai/src/api/openai-completions.ts"
rust = ["openai_chat_reasoning_details_survive_round_trip"]
status = "deliberate-divergence"
reason = "The §10.11 replay-envelope replacement stores ordered reasoning details as explicit JSON-byte replay items."

[[mapping]]
source = "packages/ai/src/api/openai-responses-shared.ts"
rust = ["responses_response_id_survives_round_trip"]
status = "deliberate-divergence"
reason = "The §10.11 replay-envelope replacement persists response identity alongside ordered provider output items."

[[mapping]]
source = "packages/ai/src/api/bedrock-converse-stream.ts"
rust = ["bedrock_redacted_bytes_survive_json_round_trip"]
status = "deliberate-divergence"
reason = "The §10.11 replay-envelope replacement retains redacted reasoning as bytes and base64-encodes only at JSON boundaries."

[[mapping]]
source = "packages/ai/src/api/google-shared.ts"
rust = ["google_tool_call_replay_target_round_trip"]
status = "deliberate-divergence"
reason = "The §10.11 replay-envelope replacement attaches thought signatures to stable canonical targets."

[[mapping]]
source = "packages/ai/src/auth/types.ts"
rust = ["auth_provider_extra_fields_round_trip"]
status = "semantic-parity"

