# Architecture v2 part 2 §10.11 divergence allowlist. Each row is represented
# exactly once and names the replacement contract. A Rust list is present only
# where the replacement already has an M1 conformance test.

[[mapping]]
source = "packages/ai/src/types.ts#mutable-partial-provider-signatures"
rust = ["anthropic_signature_fragments_append_in_order", "replay_r4_same_provider_round_trip_is_deterministic_before_encoder"]
status = "deliberate-divergence"
allowlist_row = "mutable-partial-provider-signatures"
replacement = "Explicit replay stream events plus AssistantAssembler."
reason = "Rust events are immutable values, so provider replay metadata is carried by explicit replay events and assembled authoritatively instead of silently mutating a shared partial message."

[[mapping]]
source = "packages/ai/src/types.ts#stream-function-error-contract"
rust = ["stream_cancellation_is_terminal_message", "stream_failure_is_terminal_message"]
status = "deliberate-divergence"
allowlist_row = "event-stream-only-error-handling"
replacement = "In-band committed terminal message plus structured RunOutcome."
reason = "Rust uses Result at request-start boundaries while preserving Pi's partial-output behavior in a terminal failed or cancelled assistant record and, at the agent boundary, a structured run outcome."

[[mapping]]
source = "packages/agent/src/agent.ts#continue"
rust = []
status = "deliberate-divergence"
allowlist_row = "continue-retry-ambiguity"
replacement = "Strict continue_run plus explicit retry_last_turn."
reason = "Pi's implementation rejects an assistant-tail continue despite README ambiguity; Rust keeps that precondition and adds an explicit retry operation."

[[mapping]]
source = "packages/agent/src/stream-fn.ts"
rust = ["model_runtime_is_a_narrow_arc_capability_and_local_runtime_accepts_rc_state"]
status = "deliberate-divergence"
allowlist_row = "global-default-stream-function"
replacement = "Explicit ModelRuntime injection and AgentFactory."
reason = "An explicitly injected runtime replaces mutable process-global request routing for deterministic tests, multiple tenants, and FFI."

[[mapping]]
source = "packages/ai/src/api/transform-messages.ts"
rust = []
status = "deliberate-divergence"
allowlist_row = "silent-lossy-context-transformations"
replacement = "HandoffReport and optional strict rejection."
reason = "Every lossy handoff change is reported, and callers may reject lossy projection instead of accepting Pi's silent transformation."

[[mapping]]
source = "packages/ai/src/types.ts#legacy-replay-fields"
rust = ["replay_r1_complete_item_identity_is_stable", "replay_r6_signature_target_is_exact_and_stable", "replay_r7_provider_order_is_independent_of_block_order"]
status = "deliberate-divergence"
allowlist_row = "overloaded-provider-replay-fields"
replacement = "Versioned ordered ReplayEnvelope; Pi importer/exporter handles legacy slots."
reason = "Provider replay artifacts use typed targets, applicability, completeness, and provider order rather than overloading three unrelated string fields."

[[mapping]]
source = "packages/ai/src/auth/oauth/openai-codex.ts"
rust = []
status = "deliberate-divergence"
allowlist_row = "provider-owned-loopback-server"
replacement = "Host-provided RedirectReceiver; core owns OAuth state machine."
reason = "The host owns platform redirect reception while pi-ai retains PKCE, state validation, token exchange, polling, and flow arbitration."

[[mapping]]
source = "packages/agent/src/harness/session/jsonl/codec.ts"
rust = []
status = "deliberate-divergence"
allowlist_row = "pi-v4-only-session-format"
replacement = "Native versioned log plus explicit Pi-v4 compatibility backend."
reason = "The native log must represent replay completeness and other Rust state losslessly; the Pi-v4 writer rejects unrepresentable mutations."

[[mapping]]
source = "packages/agent/src/harness/agent-harness.ts"
rust = []
status = "deliberate-divergence"
allowlist_row = "top-level-harness-scaffold"
replacement = "Implement orchestration against the already-defined subsystem contracts and tests."
reason = "The pinned top-level harness is a scaffold, so Rust derives orchestration from implemented session, reducer, compaction, environment, tool, and telemetry contracts."

