[package]
name = "pi-ai-github-copilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Github Copilot provider registration for pi-ai."
publish = false

[dependencies]
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
futures-util = "0.3.31"
http = "1.3.1"
httpdate = "1.0.3"
pi-ai = { path = "../../crates/pi-ai" }
pi-ai-anthropic = { path = "../pi-ai-anthropic" }
pi-ai-openai = { path = "../pi-ai-openai" }
pi-ai-provider-common = { path = "../pi-ai-provider-common" }
serde_json = "1.0.149"
url = "2.5.7"

[dev-dependencies]
futures-executor = "0.3.31"
