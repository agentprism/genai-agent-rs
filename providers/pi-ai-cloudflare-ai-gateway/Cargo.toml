[package]
name = "pi-ai-cloudflare-ai-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Cloudflare Ai Gateway provider registration for pi-ai."
publish = false

[dependencies]
http = "1.3.1"
pi-ai = { path = "../../crates/pi-ai" }
pi-ai-anthropic = { path = "../pi-ai-anthropic" }
pi-ai-openai = { path = "../pi-ai-openai" }
pi-ai-provider-common = { path = "../pi-ai-provider-common" }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = "2.5.7"

[dev-dependencies]
futures-executor = "0.3.31"
http = "1.3.1"
