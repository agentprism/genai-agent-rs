[package]
name = "agentprism-pi-messages"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Native pi-messages API-family implementation for agentprism-ai."
publish = false

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
http = "1.3.1"
agentprism-ai = { path = "../../crates/agentprism-ai" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
futures-executor = "0.3.31"
