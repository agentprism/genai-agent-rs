[package]
name = "pi-ai-mistral"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Mistral Conversations API-family and provider adapter for pi-ai."
publish = false

[dependencies]
futures-util = "0.3.31"
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
http = "1.3.1"
pi-ai = { path = "../../crates/pi-ai" }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
futures-executor = "0.3.31"
