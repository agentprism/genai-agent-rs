[package]
name = "agentprism-openrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "OpenRouter provider leaf for agentprism-ai."
publish = false

[dependencies]
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
futures-util = "0.3.31"
http = "1.3.1"
agentprism-ai = { path = "../../crates/agentprism-ai" }
agentprism-openai = { path = "../agentprism-openai" }
agentprism-provider-common = { path = "../agentprism-provider-common" }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = { version = "2.5.7", features = ["serde"] }
