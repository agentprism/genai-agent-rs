[package]
name = "agentprism-azure-openai-responses"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Azure Openai Responses provider registration for agentprism-ai."
publish = false

[dependencies]
http = "1.3.1"
agentprism-ai = { path = "../../crates/agentprism-ai" }
agentprism-openai = { path = "../agentprism-openai" }
agentprism-provider-common = { path = "../agentprism-provider-common" }
url = "2.5.7"

[dev-dependencies]
futures-executor = "0.3.31"
serde_json = { version = "1.0.145", features = ["raw_value"] }
