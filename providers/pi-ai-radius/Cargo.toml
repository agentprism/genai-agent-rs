[package]
name = "pi-ai-radius"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Dynamic Radius gateway provider for pi-ai."
publish = false

[dependencies]
futures-util = "0.3.31"
http = "1.3.1"
pi-ai = { path = "../../crates/pi-ai" }
pi-ai-provider-common = { path = "../pi-ai-provider-common" }
pi-ai-pi-messages = { path = "../pi-ai-pi-messages" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
futures-executor = "0.3.31"
