[package]
name = "pi-ai-openai"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "OpenAI-compatible Chat Completions API-family implementation for pi-ai."
publish = false

[dependencies]
futures-util = "0.3.31"
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
http = "1.3.1"
pi-ai = { path = "../../crates/pi-ai" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = { version = "2.5.7", features = ["serde"] }
zstd = "0.13.3"

[dev-dependencies]
base64 = "0.22.1"
futures-executor = "0.3.31"
pi-ai-deepseek = { path = "../pi-ai-deepseek" }
pi-ai-openai-codex = { path = "../pi-ai-openai-codex" }
pi-ai-openrouter = { path = "../pi-ai-openrouter" }
