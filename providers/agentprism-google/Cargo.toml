[package]
name = "agentprism-google"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Shared Google API-family implementation and Gemini provider for agentprism-ai."
publish = false

[dev-dependencies.agentprism-google-vertex]
path = "../agentprism-google-vertex"

[dependencies]
futures-util = "0.3.31"
http = "1.3.1"
agentprism-ai = { path = "../../crates/agentprism-ai" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
url = { version = "2.5.7", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[dev-dependencies]
base64 = "0.22.1"
futures-executor = "0.3.31"
