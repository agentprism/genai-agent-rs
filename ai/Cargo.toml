[package]
# The pi-ai port crate. Published name carries the agentprism- prefix (crate-naming ruling);
# the lib target is `ai` so code reads `use ai::…`, mirroring how the repo's other crates alias.
name = "agentprism-ai"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentprism/genai-agent-rs"
description = "Faithful Rust port of pi-ai (@earendil-works/pi-ai): provider-neutral types, the assistant event protocol, and per-wire-protocol API implementations."
publish = false # until the first reviewed, publishable milestone

[lib]
name = "ai"

[dependencies]
# Ruled 2026-08-21: the selected Anthropic SDK. The fidelity layer owns raw HTTP/SSE because
# adk-anthropic's public stream API does not expose pi's response hook or per-request fetch seam.
adk-anthropic = "=1.0.0"
# Ruled 2026-08-21: the selected Google SDK. The fidelity layer owns raw request conversion
# because adk-gemini's typed request drops fields that pi's replacement-payload hook can add.
adk-gemini = { version = "=1.0.0", features = ["vertex"] }
aws-config = "1"
aws-credential-types = "1"
aws-sdk-bedrockruntime = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-types = "1"
base64 = "0.23"
bytes = "1"
chrono = "0.4"
eventsource-stream = "0.2"
futures = "0.3"
getrandom = "0.3"
google-cloud-auth = { version = "=1.8.0", default-features = false, features = ["default-rustls-provider"] }
http = "1"
http-body = "1"
httpdate = "1"
hyper = { version = "1", features = ["http1"] }
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.49", default-features = false }
# Ruled 2026-08-19: the selected OpenAI SDK. The fidelity layer owns raw HTTP/SSE because
# openai-oxide's public stream API collapses response hooks and is not byte-correct across chunks.
openai-oxide = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["charset", "http2", "json", "stream", "rustls-tls"] }
regex = "1"
rustix = { version = "1", features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "test-util", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v7"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
# Hermetic HTTP/SSE test server for wire tests (same stack as the fork's yakbak harness).
http-body-util = "0.1"
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
sha2 = "0.10"
